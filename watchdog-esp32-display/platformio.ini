; platformio.ini — CYD2USB (Sunton ESP32-2432S028Rv3) — VERIFIED display config
; Rv3 = ST7789 controller (NOT ILI9341), 2 USB ports. Display on HSPI, touch XPT2046 on VSPI.
; Config via build flags (no User_Setup.h, no lv_conf.h). We draw with TFT_eSPI directly — no LVGL.
; ⚠️ USB-C port has no CC resistors: use micro-USB (or USB-A→C). Never plug both USB at once.

[platformio]
default_envs = cyd2usb

[env:cyd2usb]
platform = espressif32
board = esp32dev
framework = arduino
; upload_port  = COM4      ; ← PIN to YOUR board's CH340 port. Auto-detect may pick a different device.
; monitor_port = COM4      ;   Confirm the upload log shows the right port before flashing.
upload_speed = 115200      ; 921600 is unreliable on this CH340
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv
lib_archive = false
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
	; ---- TFT_eSPI: display on HSPI, ST7789 panel (Rv3) ----
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DST7789_DRIVER            ; Rv3 is ST7789, NOT ILI9341
	-DTFT_RGB_ORDER=TFT_BGR    ; correct colors on this panel
	-DTFT_INVERSION_OFF
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_GFXFF
