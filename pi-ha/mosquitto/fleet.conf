# fleet.conf — เปิด Mosquitto บน Pi#2 ให้ Pi#1 (สถานี ADS-B) ต่อเข้ามาส่ง heartbeat ได้.
# ติดตั้ง (บน Pi#2): sudo cp pi-ha/mosquitto/fleet.conf /etc/mosquitto/conf.d/fleet.conf
#                    sudo mosquitto_passwd -c /etc/mosquitto/fleet.passwd fleet   # ตั้งรหัส user "fleet"
#                    sudo systemctl restart mosquitto
#
# ค่าเริ่มต้นของ mosquitto 2.0 = ฟังเฉพาะ localhost + anonymous → Pi#1 ต่อข้ามเครื่องไม่ได้.
# ไฟล์นี้เพิ่ม listener บนทุก interface พอร์ต 1883 + บังคับ auth (ปิด anonymous).

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/fleet.passwd

# หมายเหตุความปลอดภัย: 1883 = plaintext — ใช้ได้ใน LAN ที่เชื่อถือ. ถ้าจะข้าม network ที่ไม่ไว้ใจ
# ค่อยเพิ่ม TLS (listener 8883 + certfile/keyfile). ตอนนี้ทั้งสอง Pi อยู่ LAN เดียวกัน → 1883 พอ.
#
# user ที่ต้องมี (ตั้งด้วย mosquitto_passwd): "fleet" — ใช้ทั้ง Pi#1 health-agent และ Pi#2
# peer-watchdog (BROKER_USER=fleet / BROKER_PASS=... ในไฟล์ env ของแต่ละตัว).
